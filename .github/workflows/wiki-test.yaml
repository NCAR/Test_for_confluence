name: Wiki Test

on:
  gollum: 
  
#gollum is the GitHub event that fires when someone creates or updates a wiki page in the repo.

jobs:
  publish-wiki:
    runs-on: codebuild-github-wiki-test-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v5
        
      - name: Checkout wiki
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          fetch-depth: 0

      - name: Show Wiki Git history
        run: |
          cd wiki
          git log --oneline -5

      - name: Show deleted Wiki commit
        run: |
          cd wiki
          git show --name-status --format=fuller 121029d

      - name: Show changes wiki pages
        run: |
          echo '${{ toJson(github.event.pages) }}'

      - name: List Wiki files
        run: |
          ls -la wiki

      - name: Show Home page
        run: |
          cat wiki/Home.md

      - name: Install Python dependencies
        run: |
          pip install requests markdown

      - name: Run Python script
        env: 
          CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
          CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}
          WIKI_PAGES: ${{ toJson(github.event.pages) }}
        run: |
          python publish_confluence.py
      
