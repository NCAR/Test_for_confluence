name: Wiki Test

on:
  gollum: 
  
#gollum is the GitHub event that fires when someone creates or updates a wiki page in the repo.

jobs:
  publish-wiki:
    runs-on: codebuild-github-wiki-test-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v5
        
      - name: Checkout wiki
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: List Wiki files
        run: |
          ls -la wiki

      - name: Show Home page
        run: |
          cat wiki/Home.md

      - name: Install Python dependencies
        run: |
          pip install requests markdown

      - name: Run Python script
        env: 
          CONFLUENCE_URL: ${{ secrets.CONFLUENCE_URL }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
          CONFLUENCE_PAGE_ID: ${{ secrets.CONFLUENCE_PAGE_ID }}
          CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY}}
        run: |
          python publish_confluence.py
      
